<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Master</title>
    <!-- A logo.svg - estar na pasta assets/images -->
    <!-- A Barra no a href leva para a pagina inicial (raiz)-->
    <!-- style logo após o header pra visulizar a logo -->
    <!-- <header style="background-color: black;> -->
    <!-- A Tag NAV vem de navegação <nav></nav> dentro do nav - colocar a a Tag: <ul></ul> -->
    <!-- A TAG UL - Lista desordenada - anorder list -->
    <!-- sempre que for criar um mneu usar a TAG NAV (navigation) -->
    <!-- dentro do UL - colocar os itens de lista <li></li> -->
    <!-- # serve pra nao quebrar o link-->
    <!-- dentro do LI - colocar a TAG A (anchor) -->
    <!-- A TAG A - serve para criar links <a href="#home">Home</a> -->
    <!-- dentro do A - colocar o nome do link cada a tem q estar dentro de uma LI -->
    <!-- Depois de NAV colocar uma tag BUTTON-->
    <!-- style="background-color: black;" P/visualizar a pagina-->
    <!-- Fazer sempre COMMITs por secções - pequenos commits-->
    <!-- A TAG FIGURE - serve para agrupar imagens e legendas <figure></figure> -->
    <!-- A TAG FIGCAPTION - serve para criar legendas para as imagens-->
    <!-- <figcaption> </figcaption>-->
    <!-- ABRIR TERMINAL -  (CTRL + SHIFT + (') -->
    <!-- INDENTAR CÓDIGO - (SHIT + ALT + F )   -->
    <!-- git add. -->
    <!-- git commit -m "Commit ..." -->
    <!-- git push -->
</head>

<body>
    <header>
        <a href="/"><img src="./assets/images/logo.svg" alt="DevemDobro"></a>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#faq">Perguntas Frequentes</a></li>
                <li><a href="#contato">Fale Conosco</a></li>
            </ul>
        </nav>
        <button>
            <img src="./assets/images/icone_carrinho.svg" alt="Carrinho de Compras">
        </button>
    </header>
    <main>
        <section><!-- agrupar conteudo relacionado -->
            <h2>Produtos</h2>
            <ul>
                <li>
                    <figure>
                        <img src="./assets/images/camiseta_roxa.jpg" alt="Camiseta Dev em Dobro Roxa">
                        <figcaption>Camiseta Dev em Dobro Roxa</figcaption>
                    </figure>
                    <div>
                        <span>Cor: roxa</span>
                        <span>Tamanho: M</span>
                        <span>Preço: R$ 89,00</span>
                        <button>Adicionar ao Carrinho</button>
                    </div>
                </li>
                <li>
                    <figure>
                        <img src="./assets/images/camiseta_roxa.jpg" alt="Camiseta Dev em Dobro Roxa">
                        <figcaption>Camiseta Dev em Dobro Roxa</figcaption>
                    </figure>
                    <div>
                        <span>Cor: roxa</span>
                        <span>Tamanho: P</span>
                        <span>Preço: R$ 100,00</span>
                        <button>Adicionar ao Carrinho</button>
                    </div>
                </li>
            </ul>

        </section>
    </main>
    <footer>
    </footer>
</body>

</html>
